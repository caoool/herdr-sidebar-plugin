id = "caoool.quota-sidebar"
name = "Quota Sidebar"
version = "0.1.0"
# 0.8.0 is the oldest verified release: pane.agent_detected is in PLUGIN_HOOK_EVENT_KINDS
# and `plugin pane open --placement split --direction right` exists there.
min_herdr_version = "0.8.0"
description = "Right-hand sidebar showing subscription quota for the agent in this pane."
platforms = ["macos", "linux"]

[[build]]
command = ["npm", "ci"]

[[build]]
command = ["npm", "run", "build"]

# Re-open sidebars after a herdr restart or live handoff. One-shot: it reads the panes
# it owned from state and re-opens them, then exits.
[[startup]]
command = ["node", "bin/restore.mjs"]

# The sidebar itself. Placement is overridden at open time to a right split.
[[panes]]
id = "sidebar"
title = "quota"
placement = "split"
command = ["node", "dist/pane.js"]

[[actions]]
id = "toggle"
title = "quota: toggle sidebar"
contexts = ["pane", "workspace"]
command = ["bash", "bin/sidebar.sh", "toggle"]

[[actions]]
id = "connect-claude"
title = "quota: connect Claude (installs statusLine collector)"
contexts = ["workspace"]
command = ["node", "bin/install-collector.mjs"]

# Auto-open when herdr detects an agent. The hook receives the DETECTED pane in
# HERDR_PANE_ID (not the focused pane) — verified in src/app/api/plugins/context.rs.
[[events]]
on = "pane.agent_detected"
command = ["bash", "bin/sidebar.sh", "auto-open"]
