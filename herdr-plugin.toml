id = "caoool.sidebar"
name = "Sidebar"
version = "0.2.0"
# 0.8.0 is the oldest verified release: pane.agent_detected is in PLUGIN_HOOK_EVENT_KINDS
# and `plugin pane open --placement split --direction right` exists there.
min_herdr_version = "0.8.0"
description = "Right-hand sidebar for herdr: subscription quota, session, tools and MCP, task list, background shells and subagents."
platforms = ["macos", "linux"]

[[build]]
command = ["npm", "ci"]

[[build]]
command = ["npm", "run", "build"]

# Runs once per server start. Clears stale pane locks and makes sure the Claude quota
# collector is installed, so the plugin needs no manual setup after install.
[[startup]]
command = ["node", "bin/startup.mjs"]

# The sidebar itself. Placement is overridden at open time to a right split.
# Do not set `width` here: herdr 0.8.x refuses to load a split pane that
# declares one ("pane width and height are only supported when placement is
# popup"). bin/sidebar.sh probes `plugin pane open --help` and passes
# --width/--max-width only when that binary advertises them.
[[panes]]
id = "sidebar"
title = "sidebar"
placement = "split"
command = ["bash", "bin/pane.sh"]

[[actions]]
id = "toggle"
title = "sidebar: toggle"
contexts = ["pane", "workspace"]
command = ["bash", "bin/sidebar.sh", "toggle"]

[[actions]]
id = "connect-claude"
title = "sidebar: reinstall Claude quota collector"
contexts = ["workspace"]
command = ["node", "bin/install-collector.mjs"]

[[actions]]
id = "refresh-mcp"
title = "Refresh MCP status"
command = ["bash", "-c", "rm -f \"${HERDR_PLUGIN_STATE_DIR:-${SIDEBAR_STATE_DIR:-$HOME/.local/state/herdr/plugins/caoool.sidebar}}\"/mcp/*.json \"${HERDR_PLUGIN_STATE_DIR:-${SIDEBAR_STATE_DIR:-$HOME/.local/state/herdr/plugins/caoool.sidebar}}\"/mcp/*.lock"]

# Auto-open when herdr detects an agent. The hook receives the DETECTED pane in
# HERDR_PANE_ID (not the focused pane) — verified in src/app/api/plugins/context.rs.
[[events]]
on = "pane.agent_detected"
command = ["bash", "bin/sidebar.sh", "auto-open"]
